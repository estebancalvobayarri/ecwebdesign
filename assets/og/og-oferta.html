<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>OG image · oferta</title>
  <!-- Plantilla para generar assets/img/og-image-oferta.jpg (1200×630). No se enlaza desde la web. -->
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #edf4ff;
      background: radial-gradient(circle at 82% 6%, rgba(51, 215, 202, .20), transparent 32%),
                  radial-gradient(circle at 10% 70%, rgba(91, 107, 255, .22), transparent 40%),
                  radial-gradient(circle at 95% 100%, rgba(91, 107, 255, .14), transparent 35%), #080f20;
    }
    .in { height: 100%; padding: 56px 72px 52px; display: grid; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr auto; column-gap: 56px; }
    .banner { grid-column: 1 / -1; font-size: 40px; font-weight: 900; letter-spacing: .02em; line-height: 1; }
    .banner span, .accent { color: #4ce0d1; }
    .copy { align-self: center; }
    .eyebrow { color: #4ce0d1; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; font-weight: 800; }
    h2 { font-size: 84px; line-height: 1.02; letter-spacing: -.06em; font-weight: 700; margin-top: 22px; }
    .card { align-self: center; text-align: center; border: 1px solid #30435e; border-radius: 28px; padding: 40px 36px; background: rgba(18, 30, 53, .92); box-shadow: 0 24px 75px rgba(0,0,0,.3); }
    .price { white-space: nowrap; font-size: 112px; font-weight: 900; line-height: 1; letter-spacing: -.05em; margin-top: 16px; }
    .sub { display: inline-block; margin-top: 22px; padding: 9px 18px; border: 1px solid #415875; border-radius: 999px; color: #b9c9df; font-size: 19px; font-weight: 600; }
    .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; color: #b9c9df; font-size: 20px; font-weight: 600; }
    .foot b { color: #edf4ff; font-weight: 700; }
  </style>
</head>
<body>
  <div class="in">
    <div class="banner">TU WEB <span>POR MUY POCO</span></div>
    <div class="copy">
      <p class="eyebrow">Webs para autónomos y pymes</p>
      <h2>Tu web profesional,<span class="accent"> hecha por mí.</span></h2>
    </div>
    <div class="card">
      <p class="eyebrow">Todo incluido</p>
      <div class="price">200<span class="accent"> €</span></div>
      <div class="sub">1.er año incluido</div>
    </div>
    <div class="foot"><span>Marca · Logo · Web con tu dominio</span><b>ecwebdesign.es/oferta</b></div>
  </div>
</body>
</html>
