<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG image · ecwebdesign</title>
  <!-- Plantilla para generar assets/img/og-image-en.jpg (1200×630). No se enlaza desde la web. -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { background: var(--ec-papel); color: var(--ec-tinta); font-family: var(--ec-sans); position: relative; }
    .mark { position: absolute; right: -150px; bottom: -150px; width: 820px; color: var(--ec-linea); }
    .in { position: relative; height: 100%; padding: 64px 72px; display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr auto; column-gap: 56px; }
    .logo { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
    .logo svg { width: 54px; }
    .logo span { font-size: 26px; font-weight: 500; letter-spacing: -.03em; }
    .copy { align-self: center; }
    .label { font-size: 15px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--ec-piedra); }
    h1 { font-size: 66px; font-weight: 300; letter-spacing: -.035em; line-height: 1.02; margin-top: 22px; }
    h1 .soft { color: var(--ec-piedra); }
    .price { align-self: center; background: var(--ec-tinta); color: var(--ec-papel); border-radius: 22px; padding: 36px; display: grid; gap: 20px; }
    .price .label { color: var(--ec-niebla); font-size: 14px; }
    .amount { display: flex; align-items: flex-start; gap: 6px; font-size: 128px; font-weight: 300; letter-spacing: -.05em; line-height: .9; }
    .amount small { font-size: .4em; letter-spacing: 0; margin-top: .25em; }
    .badge { justify-self: start; background: var(--ec-senal); color: var(--ec-tinta); font-size: 17px; font-weight: 700; padding: 9px 16px; border-radius: 999px; }
    .url { grid-column: 1 / -1; font-family: var(--ec-mono); font-size: 18px; font-weight: 500; color: var(--ec-piedra); display: flex; align-items: center; gap: 12px; }
    .url::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ec-senal); }
  </style>
</head>
<body>
  <svg class="mark" viewBox="4 16 144 76" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"><path d="M13 54H79"/><path d="M79 54A33 33 0 1 0 71.3 75.2"/><path d="M138.3 30.7A33 33 0 1 0 138.3 77.3"/></g></svg>
  <div class="in">
    <div class="logo">
      <svg viewBox="4 16 144 76" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"><path d="M13 54H79"/><path d="M79 54A33 33 0 1 0 71.3 75.2"/><path d="M138.3 30.7A33 33 0 1 0 138.3 77.3"/></g></svg>
      <span>esteban calvo</span>
    </div>
    <div class="copy">
      <p class="label">Design &amp; web · València</p>
      <h1>Professional design and web, <span class="soft">within every entrepreneur’s reach.</span></h1>
    </div>
    <div class="price">
      <span class="label">All included</span>
      <div class="amount"><small>€</small>200</div>
      <span class="badge">First year included</span>
    </div>
    <div class="url">ecwebdesign.es/en</div>
  </div>
</body>
</html>
